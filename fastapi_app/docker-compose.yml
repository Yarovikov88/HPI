version: "3.8"
services:
  api:
    build: ./backend
    container_name: fastapi_app
    restart: always
    expose:
      - "8000"
    environment:
      - TZ=Europe/Moscow
    env_file:
      - .env

  nginx:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "8888:8888"
      - "8443:8443"
    depends_on:
      - api