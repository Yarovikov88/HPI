events {}

http {
    # HTTP -> HTTPS redirect
    server {
        listen 8888;
        server_name hpi.expert www.hpi.expert;
        return 301 https://$server_name:8443$request_uri;
    }

    # HTTPS server
    server {
        listen 8443 ssl;
        server_name hpi.expert www.hpi.expert;

        ssl_certificate /etc/letsencrypt/live/hpi.expert/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hpi.expert/privkey.pem;

        # SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Disable keep-alive to client
        keepalive_timeout 0;

        location / {
            proxy_pass http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Connection close;

            # Stabilize body length: no gzip from upstream; auto-decompress if any
            gzip off;
            proxy_set_header Accept-Encoding "identity";
            gunzip on;

            # Let nginx buffer and compute proper Content-Length
            proxy_buffering on;
            proxy_buffers 8 256k;
            proxy_busy_buffers_size 256k;

            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            add_header Cache-Control "no-store" always;
        }
    }
} 