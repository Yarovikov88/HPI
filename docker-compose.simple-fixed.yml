version: "3.8"

services:
  # Основной веб-сервер (фронтенд + nginx)
  web:
    build: .
    image: hpi-web:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: unless-stopped
    networks:
      - hpi-network
    depends_on:
      - fastapi_app

  # Подключение к существующим контейнерам
  fastapi_app:
    image: back-api
    container_name: fastapi_app
    networks:
      - hpi-network
    external_links:
      - hpi-db:db

networks:
  hpi-network:
    external: true 